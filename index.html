
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Recognition AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#e8f5e9,#c8e6c9);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    background: white;
    width: 100%;
    max-width: 550px;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.12);
    text-align: center;
}

h1 { color: #218c4a; }

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

.upload-box {
    border: 2px dashed #80c995;
    background: #f5fff7;
    padding: 25px;
    border-radius: 18px;
    cursor: pointer;
}

.upload-box:hover {
    background: #e8f8ed;
}

.upload-icon { font-size: 55px; }

.upload-box p {
    color: #388e52;
    font-weight: bold;
}

input[type=file] { display: none; }

#preview {
    max-width: 100%;
    max-height: 300px;
    object-fit: contain;
    margin-top: 20px;
    border-radius: 15px;
    display: none;
}

button {
    width: 100%;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

#uploadBtn {
    background: #219653;
    color: white;
}

#predictBtn {
    background: #ff9800;
    color: white;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#result {
    margin-top: 25px;
    text-align: left;
}

.result-title {
    color: #218c4a;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

.prediction {
    background: #f1f8f3;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    color: #333;
}

.progress {
    background: #ddd;
    border-radius: 20px;
    height: 10px;
    margin-top: 8px;
    overflow: hidden;
}

.progress-bar {
    background: #28a745;
    height: 100%;
    border-radius: 20px;
}

.status {
    color: #777;
    margin-top: 15px;
    font-size: 14px;
}

.footer {
    color: #aaa;
    font-size: 12px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🍎 Fruit Recognition AI</h1>

    <p class="subtitle">
        ระบบตรวจจับและจำแนกชนิดผลไม้ด้วย AI
    </p>

    <label for="imageUpload" class="upload-box">
        <div class="upload-icon">📸</div>
        <p>คลิกเพื่อเลือกภาพผลไม้</p>
        <small>รองรับ JPG, PNG, JPEG (1 ภาพ)</small>
    </label>

    <input type="file"
        id="imageUpload"
        accept="image/jpeg,image/png">

    <img id="preview" alt="ภาพผลไม้">

    <button id="uploadBtn" onclick="uploadImage()">
        📤 Upload Image
    </button>

    <button id="predictBtn" onclick="predict()" disabled>
        🔍 ตรวจจับผลไม้
    </button>

    <div class="status" id="status">
        กรุณาเลือกภาพที่ต้องการตรวจจับ
    </div>

    <div id="result"></div>

    <div class="footer">
        Powered by Teachable Machine & TensorFlow.js
    </div>

</div>

<script>

const URL = "./my_model/";

let model;
let imageUploaded = false;

// โหลดโมเดล AI
async function loadModel() {
    document.getElementById("status").innerText =
        "⏳ กำลังโหลด AI Model...";

    try {
        model = await tmImage.load(
            URL + "model.json",
            URL + "metadata.json"
        );

        document.getElementById("status").innerText =
            "✅ AI พร้อมใช้งานแล้ว";

    } catch (error) {
        document.getElementById("status").innerText =
            "❌ โหลดโมเดลไม่สำเร็จ";
        console.error(error);
    }
}

// เลือกรูปภาพ
document.getElementById("imageUpload")
.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("กรุณาเลือกไฟล์รูปภาพเท่านั้น");
        return;
    }

    const preview = document.getElementById("preview");

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    imageUploaded = false;

    document.getElementById("predictBtn").disabled = true;
    document.getElementById("result").innerHTML = "";

    document.getElementById("status").innerText =
        "เลือกภาพเรียบร้อยแล้ว กรุณากด Upload";
});

// ปุ่ม Upload
function uploadImage() {

    const file = document.getElementById("imageUpload").files[0];

    if (!file) {
        alert("กรุณาเลือกรูปภาพก่อน");
        return;
    }

    imageUploaded = true;

    document.getElementById("predictBtn").disabled = false;

    document.getElementById("status").innerText =
        "✅ Upload ภาพสำเร็จ พร้อมตรวจจับผลไม้";
}

// ตรวจจับผลไม้
async function predict() {

    if (!model) {
        alert("AI Model ยังโหลดไม่เสร็จ");
        return;
    }

    if (!imageUploaded) {
        alert("กรุณา Upload ภาพก่อน");
        return;
    }

    const img = document.getElementById("preview");

    document.getElementById("status").innerText =
        "🔍 กำลังตรวจจับผลไม้...";

    document.getElementById("predictBtn").disabled = true;

    try {

        const predictions = await model.predict(img);

        predictions.sort((a, b) =>
            b.probability - a.probability
        );

        let html = `
            <div class="result-title">
                📊 ผลการตรวจจับ
            </div>
        `;

        predictions.forEach(item => {

            const percent =
                (item.probability * 100).toFixed(2);

            html += `
                <div class="prediction">
                    <strong>🍎 ${item.className}</strong>
                    <span style="float:right">
                        ${percent}%
                    </span>

                    <div class="progress">
                        <div class="progress-bar"
                            style="width:${percent}%">
                        </div>
                    </div>
                </div>
            `;
        });

        document.getElementById("result").innerHTML = html;

        document.getElementById("status").innerText =
            "✅ ตรวจจับเสร็จเรียบร้อย";

    } catch (error) {

        document.getElementById("status").innerText =
            "❌ เกิดข้อผิดพลาดในการตรวจจับ";

        console.error(error);

    } finally {
        document.getElementById("predictBtn").disabled = false;
    }
}

// เริ่มโหลดโมเดล
loadModel();

</script>

</body>
</html>
